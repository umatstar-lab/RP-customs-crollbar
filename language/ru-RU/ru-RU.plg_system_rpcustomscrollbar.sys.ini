PLG_SYSTEM_CUSTOM_SCROLLBAR="Система — RP Custom Scrollbar"
PLG_SYSTEM_CUSTOM_SCROLLBAR_XML_DESCRIPTION="<p>Плагин настраивает оформление полосы прокрутки на сайте и в панели управления Joomla.</p><p>Включите плагин и задайте нужные цвета, размеры и рамки.</p><p>Firefox использует стандартные цвета полосы прокрутки. Точная ширина, рамки и оформление при наведении зависят от возможностей браузера.</p>"
