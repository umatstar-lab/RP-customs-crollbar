PLG_SYSTEM_CUSTOM_SCROLLBAR="Система — RP Custom Scrollbar"
PLG_SYSTEM_CUSTOM_SCROLLBAR_XML_DESCRIPTION="<p>Плагін налаштовує оформлення смуги прокручування на сайті та в панелі керування Joomla.</p><p>Увімкніть плагін і задайте потрібні кольори, розміри та рамки.</p><p>Firefox використовує стандартні кольори смуги прокручування. Точна ширина, рамки та оформлення під час наведення залежать від можливостей браузера.</p>"
